nc: 1  # number of classes
#kpt_shape: [17, 3]
depth_multiple: 1  # model depth multiple
width_multiple: 1  # layer channel multiple
image_shape: [480, 640]
# anchors:
#     # autogenerated by yolo
#   - [0,0, 0,0, 0,0] # P3/8
#   - [0,0, 0,0, 0,0] # P4/16
#   - [0,0, 0,0, 0,0] # P5/32
backbone:
  # [from, number, module, args]
  #src num layer               params                  id  rf  notes
  [[-1, 1, InvertedResidual, [3, 4, 12, 2, 4]],  #  0 c1   1 stride -> 2
   [-1, 1, InvertedResidual, [12, 4, 48, 2]],    #  1 c2   3 stride -> 4
   [-1, 1, InvertedResidual, [48, 4, 48, 2]],    #  2    7 stride -> 8
   [-1, 1, S2f,              [48, 2, 48, 32]],   #  3 c3
   [-1, 1, InvertedResidual, [48, 2, 64, 2]],#  4     15 stride -> 16
   [-1, 1, S2f,              [64, 2]],           #  5 c4  47
   [-1, 1, InvertedResidual, [64, 2, 96, 2]],    #  6     63 stride -> 32
   [-1, 1, S2f,              [96, 2, 96, 64]],           #  7
   [-1, 1, InvertedResidual, [96, 2, 128, 2]],    #  8     63 stride -> 64
   [-1, 1, S2f,              [128, 2]]]           #  9 c5 127

# YOLOv5 v6.0 head
head:
  [[-1, 1, Classify, [128, nc]]   # 43 Detect(P4-P6)
   ]                              # rfs 127 255
